name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to install (blank = the pin below)"
        required: false
        default: ""

permissions:
  contents: read

# The README says build, clean and test run under jolt as well as bb, so CI
# runs them under both. Pinned to a release so an overnight jolt change can't
# turn a docs-engine PR red; workflow_dispatch can try another version.
env:
  JOLT_VERSION: ${{ inputs.jolt-version || '0.8.27' }}

# Scoped by ref, so a pull request build cannot supersede another pull
# request's, and neither queues behind main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Test
        run: bb test

      # The prebuilt jolt binary is self-contained and lands in ~/.local/bin.
      # The version comes in through env, not interpolated into the script,
      # so the dispatch input can't inject shell.
      - name: Install jolt
        run: |
          set -euo pipefail
          : "${JOLT_VERSION:?empty; the workflow-level pin did not resolve}"
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors -sL \
            https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --version "$JOLT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test under jolt
        run: |
          jolt --version
          jolt test

      - name: Build under jolt
        run: |
          set -euo pipefail
          root="$(mktemp -d)/jolt-project"
          mkdir -p "$root/docs/guide"
          printf '# Jolt\n\nBuilt by jolt.\n' > "$root/docs/guide/index.md"
          printf '{:base-path "/jolt-project" :title "Jolt"}\n' > "$root/docs/site.edn"
          jolt run build "$root"
          test -f "$root/_site/guide/index.html" || { echo "jolt run build wrote no guide page"; exit 1; }
          grep -q 'href="/jolt-project/css/screen.css"' "$root/_site/guide/index.html" \
            || { echo "jolt build lost the base path"; exit 1; }

      # serve binds with ring-chez-adapter under jolt (serve.jolt) and with
      # http-kit under bb (serve.clj). This starts the jolt one on a free port
      # and checks it answers under the base path, 404s outside it, and
      # returns a binary asset byte for byte.
      - name: Serve under jolt
        run: |
          set -euo pipefail
          root="$(mktemp -d)/serve-project"
          mkdir -p "$root/docs/guide" "$root/docs/media"
          printf '# Serve\n\nServed by jolt.\n' > "$root/docs/guide/index.md"
          printf '{:base-path "/serve-project" :asset-dirs ["media"]}\n' > "$root/docs/site.edn"
          head -c 4096 /dev/urandom > "$root/docs/media/blob.bin"
          port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          jolt run serve "$root" "$port" > serve.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            grep -q '^Serving ' serve.log && break
            kill -0 "$pid" 2>/dev/null || { cat serve.log; echo "jolt run serve exited"; exit 1; }
            sleep 1
          done
          grep -q '^Serving ' serve.log || { cat serve.log; echo "jolt run serve never started"; exit 1; }
          base="http://127.0.0.1:$port"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/serve-project/")" = 200 \
            || { echo "homepage not served under the base path"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/elsewhere/")" = 404 \
            || { echo "a path outside the base path was not a 404"; exit 1; }
          curl -s "$base/serve-project/media/blob.bin" | cmp - "$root/docs/media/blob.bin" \
            || { echo "binary asset changed in transit"; exit 1; }
          echo "jolt run serve works"

      # The tests build sites from fixtures, which proves the renderer but
      # not that the engine works against a real project laid out on disk.
      # This builds one end to end and checks the properties that actually
      # break in production: a base-pathed site whose URLs escaped to the
      # organization root, and a homepage template that never rendered.
      - name: Build a real project end to end
        run: |
          set -euo pipefail
          root="$(mktemp -d)/demo-project"
          mkdir -p "$root/docs/guide" "$root/docs/templates" "$root/docs/media"
          printf '# Demo\n\nBody text.\n\n```mermaid\nflowchart LR\n  a --> b\n```\n' \
            > "$root/docs/guide/index.md"
          printf '{:base-path "/demo-project" :title "Demo" :asset-dirs ["media"] :home-template "home.html"}\n' \
            > "$root/docs/site.edn"
          printf '{%% extends "base.html" %%}\n{%% block content %%}<img src="{{site-base}}/media/x.gif">{%% endblock %%}\n' \
            > "$root/docs/templates/home.html"
          printf 'GIF89a' > "$root/docs/media/x.gif"

          bb build "$root"

          out="$root/_site"
          test -f "$out/index.html"          || { echo "no homepage generated"; exit 1; }
          test -f "$out/guide/index.html"    || { echo "no guide page generated"; exit 1; }
          test -f "$out/media/x.gif"         || { echo "asset dir was not copied"; exit 1; }
          test -f "$out/css/screen.css"      || { echo "static assets missing"; exit 1; }
          test ! -e "$out/.templates"        || { echo "staged templates leaked into the build"; exit 1; }

          ! grep -q '{{site-base}}' "$out/index.html" \
            || { echo "unrendered template variable in the homepage"; exit 1; }
          grep -q 'src="/demo-project/media/x.gif"' "$out/index.html" \
            || { echo "the project template did not render, or lost its base path"; exit 1; }
          grep -q 'pre class="mermaid"' "$out/guide/index.html" \
            || { echo "mermaid fence was not rewritten"; exit 1; }

          # The failure this engine exists to prevent: an absolute URL that
          # resolves against the organization site instead of the project.
          if grep -ohE '(href|src)="/[^"]*"' "$out/index.html" "$out/guide/index.html" \
               | grep -vE '="/demo-project/'; then
            echo "the URLs above escape the base path and would hit the org site"
            exit 1
          fi
          # The search index has to answer queries, not just exist. This loads
          # the vendored lunr and the generated documents the way search.js
          # does, and checks the guide page comes back first for a word in it.
          test -f "$out/search-documents.json" || { echo "no search index"; exit 1; }
          grep -q 'id="nav-search"' "$out/index.html" || { echo "no search box in the nav"; exit 1; }
          node -e '
            const fs = require("fs");
            const lunr = require(process.argv[1]);
            const docs = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const bad = docs.filter(d => !d.href.startsWith("/demo-project/"));
            if (bad.length) { console.error("hrefs escape the base path:", bad); process.exit(1); }
            const isPage = d => !d.href.includes("#");
            const idx = lunr(function () {
              this.ref("href");
              this.field("title", { boost: 10, extractor: d => isPage(d) ? d.title : "" });
              this.field("page", { boost: 2, extractor: d => d.title });
              this.field("heading", { boost: 5 });
              this.field("text");
              docs.forEach(d => this.add(d, { boost: isPage(d) ? 3 : 1 }));
            });
            const q = s => idx.query(qq => lunr.tokenizer(s).map(String).forEach(t => {
              qq.term(t, { boost: 10 });
              qq.term(t, { usePipeline: false, wildcard: lunr.Query.wildcard.TRAILING });
            }));
            const hits = q("body");
            if (!hits.length || hits[0].ref !== "/demo-project/guide/index.html") {
              console.error("expected /demo-project/guide/index.html first, got", hits.map(h => h.ref)); process.exit(1);
            }
            ["body:", "bo*", "\"body\""].forEach(s => q(s));
            console.log("search index builds and answers");
          ' "$out/vendor/lunr/lunr.min.js" "$out/search-documents.json"
          echo "end-to-end build is correct"
